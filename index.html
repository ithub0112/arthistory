<script>
const C=[
["一、史前","約公元前 3 萬年–前 3000 年",[
["1-1","洞窟壁畫與史前雕刻","約前 3 萬–前 1800 年",
"洞窟壁畫是人類最早留下的大型繪畫之一，主要出現在舊石器時代晚期。已知洞穴集中在歐洲西南部，尤其是法國與西班牙，距今約數萬年。\n顏料取自大自然：赭石（含鐵的土壤或礦物）提供紅、黃色，黑色多用木炭或錳礦。人們把礦物磨成粉末，再加入油脂、水等媒介調成液態顏料，用手指、獸毛或骨管塗繪。\n題材以野牛、馬、鹿等動物為主，與狩獵生活息息相關。畫家善用洞壁凹凸不平的岩面，讓形體更立體、有動感。可能與祈求狩獵成功、巫術和儀式有關，但真正用途仍無定論。\n史前人類也用石頭、骨頭與陶土創造形體，表達對生活、信仰與祭祀的理解。維倫多夫的維納斯（約前 23000 年，現藏奧地利）比例誇張，可能象徵生育與豐收；「維納斯」是後人借羅馬愛神命名。新石器時代的印紋陶器與鐘形杯（約前 2800–1800 年）則以幾何紋樣為主，特點是容易重複排列、節奏性強。\n藝術不只是「好不好看」，更是人類生活、文化與思想的重要記錄。",
"拉斯科洞窟（法國）、阿爾塔米拉洞窟（西班牙）、維倫多夫的維納斯、鐘形杯","已知史前洞穴多分佈在哪兩個國家？｜西班牙、法國"]]],
["二、古代","前 3100–公元 476 年",[
["2-1","古埃及","約前 3100–前 30 年",
"古埃及藝術與國家治理、宗教、墓葬及王權密切相連：金字塔需要龐大資源與勞動組織，神廟浮雕呈現君王與神祇的關係，墓室壁畫描繪死者生前生活與死後世界的活動。\n尼羅河影響一切：河水與沖積土讓農業成為可能，河道是運送人員、糧食、石材的交通線，每年氾濫的週期也塑造了對生命、死亡、再生與自然秩序的觀念。死後審判「秤心」（心臟與羽毛比重量）是常見題材。\n繪畫沒有透視，人物採「正側面律」（複合視點）：頭與腿畫側面，眼與肩畫正面，讓特徵最清楚；以人物大小區分身份，法老最大。象形文字（聖書體）常與圖像並置。常見題材是日常生活、葬禮與死後世界，如沼澤狩獵圖。\n雕塑與建築追求永恆、秩序與身分，因此穩定、莊嚴、對稱、幾何化。雕像以花崗岩、石灰岩製成，有供靈魂寄居的功能；另有人像棺、陪葬俑烏沙布提、黃金面具。阿布辛貝神廟（約前 1300–前 1233 年）高 30 公尺，門前有四座各 20 公尺高的拉美西斯二世坐像。方尖碑立於神廟門前，路克索神廟的柱子則是尼羅河植物的造型延伸。泥磚建造的住宅與宮殿多半難以保存。",
"吉薩金字塔、圖坦卡門黃金面具、書記官坐像、娜芙蒂蒂胸像、阿布辛貝神廟、路克索神廟","古埃及壁畫人物同時呈現側面頭部與正面軀幹，這種方式稱為？｜複合視角（正側面律）"]
,["2-2","美索不達米亞","約前 3500–前 539 年",
"位於底格里斯與幼發拉底兩河流域，發展序列為蘇美、阿卡德、巴比倫、亞述，再到波斯帝國。這裡不以法老、金字塔與來世信仰為核心，而與城市國家的形成、王權競爭、神祇崇拜、戰爭、法律制度與帝國統治密切相關。\n蘇美：發明楔形文字。祭祀雕像有幾何化造型、精細的頭髮鬍子、放大的雙眼與站姿；烏爾軍旗（約前 2600–2400 年）以條帶敘述戰爭與和平；圓筒印章滾壓泥板成圖案；烏爾塔廟（Ziggurat）是階梯狀的神廟高台。阿卡德皇帝頭像展現成熟的鑄銅技術。\n巴比倫：漢摩拉比法典碑（約前 1776 年）把法律刻在石碑上；伊絲塔城門以藍色琉璃磚裝飾；巴別塔傳說與其城市相關。亞述：以善戰聞名，浮雕表現軍事遠征與戰鬥場面，具敘事性與莊重感，也有象徵意義的動物；人首翼牛神獸拉馬蘇守衛宮殿門口，被相信能趕走惡靈。\n波斯：風格承繼巴比倫，波斯波利斯遺址有萬國之門、阿帕達納宮的朝貢浮雕（描繪各民族攜物進貢，表現帝國疆域廣大與多民族臣服的秩序）、以雙頭公牛與雙頭獅為柱頭的波斯柱式，工匠也擅長製作黃金裝飾品如角狀酒杯。",
"烏爾軍旗、烏爾塔廟、漢摩拉比法典碑、伊絲塔城門、拉馬蘇、波斯波利斯","波斯波利斯朝貢浮雕的主要目的為何？｜表現帝國疆域廣大及多民族臣服的秩序"]
,["2-3","古希臘（含愛琴海文明）","前 3000–前 30 年",
"愛琴海文明：邁諾安（前 3000–1100 年，克里特島）以克諾索斯皇宮為代表，壁畫色彩鮮豔、律動感強，題材是自然與生活儀式，執蛇女神形象活潑不拘謹。邁錫尼（希臘南部，見於荷馬史詩）宮殿以中央大廳加側邊數個小室組成，影響後來的希臘神廟；獅子門兼具堡壘防禦功能；阿伽門農面具以純金塑造。\n分期：史前 3000–1200、黑暗時期 1200–800、古樸 800–500、古典 500–330、希臘化 330–30（前）。特色是民主思想與自由，雅典為中心。陶器演變為幾何形、東方化、黑繪式、紅繪式：幾何形講求直線、對稱與形式化（迪皮隆陶瓶）；東方化受近東影響；黑繪式約前 540 年；紅繪式多描寫日常生活。\n建築：神殿有山形牆，比例講究黃金比例，柱頂楣原本有彩繪。三種柱式：多利克（樸實沉穩，稱男性柱，如巴特農神廟）、愛奧尼亞（纖細秀美，稱女性柱，柱頭取自鸚鵡螺般的渦卷，如艾瑞克提恩神廟）、科林斯（由愛奧尼亞演變，裝飾性強，柱頭圍繞莨苕葉，如雅典奧林匹亞宙斯神殿）。羅馬人後來又發展出自己的柱式。\n雕塑：古樸時期僵硬樸拙；古典時期強調精確、均衡、安定的理性表現，菲狄亞斯（巴特農雅典娜）被稱為「神的雕刻家」，米隆作《擲鐵餅者》，波利克萊塔斯作《持矛者》，被稱為「人的雕刻家」。希臘化時期重視人物內心的動靜與外在表情，反映對現實生活的關心與生命力。\n劇場源於戴奧尼索斯崇拜、節慶與比賽，平面分為表演區與觀眾席。\n附・伊特魯里亞（義大利中部，羅馬的前身之一）：饅頭形與住宅型墳墓、樂師舞者與宴會壁畫、神殿模型、石棺，以及象徵羅馬的母狼像。",
"克諾索斯皇宮、獅子門、巴特農神廟、擲鐵餅者、持矛者、勞孔群像、垂死的高盧人、米羅的維納斯、勝利女神像、戴奧尼索斯劇場","希臘三種基本柱式是什麼？｜多利克、愛奧尼亞、科林斯"]
,["2-4","古羅馬","前 509–公元 476 年",
"羅馬承襲希臘與伊特魯里亞的成就，再發展出實用、宏大的風格。\n建築運用拱券、穹頂與混凝土，打造競技場、浴場、水道橋、凱旋門，並發展出自己的柱式。雕塑重視寫實肖像，連皺紋都忠實描繪，另有紀功柱以螺旋浮雕記載戰績。龐貝壁畫與鑲嵌畫保存了當時的室內裝飾與生活。",
"萬神殿、羅馬競技場、圖拉真紀功柱、龐貝壁畫、奧古斯都像",""]]],
["三、中世紀","約 2–15 世紀",[
["3-1","早期基督教","約 2–5 世紀",
"基督教早期受迫害，信徒在地下墓穴與石棺上用魚、牧羊人、錨等象徵符號傳達信仰。313 年君士坦丁承認基督教後，大型教堂興起，採用羅馬公共建築的「巴西利卡」長方形平面。",
"羅馬地下墓穴、舊聖彼得大教堂、聖母大殿鑲嵌畫",""],
["3-2","拜占庭","330–1453 年",
"以君士坦丁堡為中心的東羅馬帝國藝術。金色背景的鑲嵌畫與聖像讓人物正面、莊嚴、平面化，重視靈性而非寫實。建築以大穹頂覆蓋方形空間為特色。",
"聖索菲亞大教堂、拉文納聖維他勒教堂鑲嵌畫、聖像畫",""],
["3-3","羅馬式","約 10–12 世紀",
"因朝聖與修道院興盛而發展。教堂以厚牆、圓拱與桶形拱頂支撐，窗小而室內昏暗厚重；雕刻集中在門楣與柱頭，以聖經故事教育不識字的信徒。",
"比薩大教堂、克呂尼修道院、聖賽南教堂",""],
["3-4","哥德式與手抄本","約 12–15 世紀",
"尖拱、肋骨拱頂與飛扶壁分擔重量，使牆面能開大窗，彩繪玻璃把光變成神聖的象徵，教堂向上延伸。同時修道院與宮廷製作華麗的彩飾手抄本，細膩描繪日常與宗教場景。",
"巴黎聖母院、沙特爾主教座堂、貝里公爵豪華時禱書",""]]],
["四、文藝復興","14–16 世紀",[
["4-1","其背景與文藝復興早期","14–15 世紀",
"義大利城邦（如佛羅倫斯）商業繁榮，富商與教會贊助藝術；人文主義重新研究古希臘羅馬，重視人的價值。藝術家發展線性透視與解剖研究，讓畫面具有可信的空間感與立體感。",
"喬托、馬薩其奧《聖三位一體》、布魯內雷斯基的穹頂、多那太羅《大衛》、波提切利《維納斯的誕生》",""],
["4-2","文藝復興盛期","約 1490–1527 年",
"古典理想的巔峰：構圖穩定、比例和諧、形象理想化，集中於羅馬與佛羅倫斯。三傑各有專長：達文西的明暗暈塗法與科學觀察、米開朗基羅的力量與雕塑感、拉斐爾的優雅與秩序。",
"達文西《蒙娜麗莎》《最後的晚餐》、米開朗基羅《大衛》《創世紀》、拉斐爾《雅典學院》",""],
["4-3","北方文藝復興","15–16 世紀",
"在阿爾卑斯山以北（尼德蘭、德國）發展，油畫技法使細節、質感與光澤極為精細，常把宗教象徵藏在日常物件裡。版畫的流行也讓藝術傳播更廣。",
"范艾克《阿爾諾芬尼夫婦》、杜勒、波希、老布勒哲爾",""]]],
["五、文藝復興後","16–19 世紀",[
["5-1","矯飾主義","約 1520–1600 年",
"反抗盛期的和諧，刻意追求個人風格：人物被拉長、姿勢扭曲、色彩不自然、空間拼貼般複雜，帶來緊張與不安。",
"帕米賈尼諾《長頸聖母》、艾爾·格雷考、布龍齊諾",""],
["5-2","巴洛克","17 世紀",
"反宗教改革時期，教會與王權用戲劇性的藝術感動大眾：動感、對角線構圖、強烈明暗對比與強烈情感。荷蘭則因市民社會興起，盛行肖像、靜物與風俗畫。",
